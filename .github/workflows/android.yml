name: Android build (Cuánto Dura)

on:
  push:
    branches: [main]
    paths:
      - 'cuanto-dura/**'
      - '.github/workflows/android.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cuanto-dura
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install deps
        run: npm ci

      - name: Sync web assets into native project
        run: |
          set +e
          npm run sync > /tmp/sync.log 2>&1
          code=$?
          echo "exit code: $code"
          cat /tmp/sync.log
          if [ $code -ne 0 ]; then
            BODY=$(node -e "const fs=require('fs');console.log(JSON.stringify({body:'Android sync log:' + String.fromCharCode(10) + fs.readFileSync('/tmp/sync.log','utf8').slice(-6000)}))")
            curl -sS -X POST -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" -H "Accept: application/vnd.github+json" "https://api.github.com/repos/${{ github.repository }}/commits/${{ github.sha }}/comments" -d "$BODY"
          fi
          exit $code

      - name: Build debug APK
        working-directory: cuanto-dura/android
        run: ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: cuanto-dura-debug-apk
          path: cuanto-dura/android/app/build/outputs/apk/debug/app-debug.apk
