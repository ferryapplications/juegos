name: iOS build (Cuánto Dura)

on:
  push:
    branches: [main]
    paths:
      - 'cuanto-dura/**'
      - '.github/workflows/ios.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    defaults:
      run:
        working-directory: cuanto-dura
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install deps
        run: npm ci

      - name: Sync web assets into native project
        run: npm run sync

      - name: Install CocoaPods dependencies
        working-directory: cuanto-dura/ios/App
        run: |
          set +e
          pod install --repo-update > /tmp/pod.log 2>&1
          code=$?
          cat /tmp/pod.log
          if [ $code -ne 0 ]; then
            BODY=$(node -e "const fs=require('fs');console.log(JSON.stringify({body:'pod install log:' + String.fromCharCode(10) + fs.readFileSync('/tmp/pod.log','utf8').slice(-6000)}))")
            curl -sS -X POST -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" -H "Accept: application/vnd.github+json" "https://api.github.com/repos/${{ github.repository }}/commits/${{ github.sha }}/comments" -d "$BODY"
          fi
          exit $code

      - name: Build for simulator (sin firma, solo validación)
        working-directory: cuanto-dura/ios/App
        run: |
          xcodebuild -workspace App.xcworkspace -scheme App \
            -sdk iphonesimulator -configuration Debug \
            CODE_SIGNING_ALLOWED=NO build
